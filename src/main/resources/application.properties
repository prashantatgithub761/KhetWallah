spring.application.name=KhetWallah

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/KhetWallah}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.upload-dir=${UPLOAD_DIR:${user.home}/KhetWallahUploads}

# Email is explicitly enabled only after a sender has been configured.
app.email.enabled=${EMAIL_ENABLED:false}
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:}
app.email.public-base-url=${APP_PUBLIC_URL:http://localhost:8080}
